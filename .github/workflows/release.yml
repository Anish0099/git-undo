name: release

# Runs when you push a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# GoReleaser cross-compiles the binaries and publishes a GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so GoReleaser can build the changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Provided automatically by Actions; no secret to configure.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
